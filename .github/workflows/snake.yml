name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: aaravjain5
          outputs: |
            dist/github-contribution-grid-snake.svg?color_dots=#ebedf0,#ffcccc,#ff8080,#ff4d4d,#ff2c2c&color_snake=#ff2c2c
            dist/github-contribution-grid-snake-dark.svg?color_dots=#161b22,#4a0d0d,#871313,#c21f1f,#ff2c2c&color_snake=#ff2c2c

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
